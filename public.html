<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>South Nagor Kosba (Kagji Para) — Finance Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3d2e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --bg:#eef3f1; --card:#fff; --text:#1f2937; --muted:#6b7280; --line:#e5e7eb;
  --green:#16a34a; --red:#ef4444; --blue:#2563eb; --purple:#6d28d9; --teal:#0891b2; --amber:#f59e0b;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Poppins','Hind Siliguri',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.35;}
.wrap{max-width:1320px; margin:0 auto; padding:0 14px 28px;}

/* ---------- banner (ছবি = আপনার ডিজাইনের ব্যানার) ---------- */
.banner{position:relative; overflow:hidden; border-radius:0 0 16px 16px; margin:0 -14px 16px; container-type:inline-size; background:#12513a;}
.banner .bimg{display:block; width:100%; height:auto;}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}
/* ছবিতে যে তারিখ-চিপ আঁকা আছে তার ঠিক ওপরে লাইভ তারিখ বসে */
.date-chip{position:absolute; left:2.65cqw; top:1.05cqw; width:13.5cqw; height:4.95cqw; background:rgba(255,255,255,.97); border-radius:1cqw; display:flex; gap:1cqw; align-items:center; padding:0 .9cqw; box-shadow:0 .3cqw 1cqw rgba(0,0,0,.12);}
.date-chip .ico{width:2.9cqw; height:2.9cqw; border-radius:.8cqw; background:#2563eb; display:grid; place-items:center; flex:none;}
.date-chip .ico svg{width:60%; height:60%;}
.date-chip b{display:block; font-size:1.3cqw; line-height:1.15; color:#111827; white-space:nowrap;}
.date-chip span{font-size:1.02cqw; color:#6b7280; white-space:nowrap;}
.mdate{display:none; font-size:13px; font-weight:600; color:#12513a; margin:-4px 0 10px;}
@media (max-width:760px){
  /* মোবাইলে পুরো ছবি খুব ছোট হয়ে যায়, তাই শিরোনামের অংশ মাঝখানে রেখে দেখাই */
  .banner{height:104px;}
  .banner .bimg{position:absolute; left:50%; top:0; width:915px; max-width:none; height:104px; margin-left:-535px;}
  .date-chip{display:none;} .mdate{display:block;}
}

/* ---------- toolbar ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; margin-bottom:14px;}
.seg{display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.seg button{border:0; background:transparent; padding:8px 16px; font:inherit; font-size:13px; font-weight:600; color:var(--muted); cursor:pointer;}
.seg button.on{background:#0f3d2e; color:#fff;}
.tools{display:flex; gap:8px; align-items:center; font-size:12px; color:var(--muted);}
.btn{border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 13px; font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; color:var(--text);}
.btn:hover{background:#f3f4f6;}
.alert{display:none; background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:10px 14px; border-radius:10px; margin-bottom:12px; font-size:13px;}

/* ---------- KPI ---------- */
.kpis{display:grid; grid-template-columns:repeat(7,1fr); gap:12px; margin-bottom:14px;}
.kpi{border-radius:12px; padding:14px 14px; color:#fff; display:flex; align-items:center; gap:12px; min-height:88px; box-shadow:0 4px 12px rgba(0,0,0,.08);}
.kpi .ic{width:42px; height:42px; flex:none; display:grid; place-items:center; background:rgba(255,255,255,.2); border-radius:11px;}
.kpi .ic svg{width:26px; height:26px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;}
.kpi .lb{font-size:12.5px; font-weight:500; opacity:.95;}
.kpi .vl{font-size:clamp(18px,1.9vw,26px); font-weight:700; margin-top:2px; white-space:nowrap;}
.k1{background:linear-gradient(135deg,#7c3aed,#4f46e5);} .k2{background:linear-gradient(135deg,#06b6d4,#0e7490);}
.k3{background:linear-gradient(135deg,#fbbf24,#d97706);} .k4{background:linear-gradient(135deg,#f87171,#dc2626);}
.k5{background:linear-gradient(135deg,#22c55e,#15803d);} .k6{background:linear-gradient(135deg,#3b82f6,#1d4ed8);}
.k7{background:linear-gradient(135deg,#bfdbfe,#93c5fd); color:#1e3a8a;} .k7 .ic{background:rgba(255,255,255,.55);} .k7 .ic svg{stroke:#1d4ed8;}

/* ---------- cards ---------- */
.row{display:grid; gap:12px; margin-bottom:14px;}
.r-charts{grid-template-columns:1fr 1fr 1.05fr 1.05fr;}
.r-tables{grid-template-columns:1.1fr 1.1fr .8fr;}
.r-bottom{grid-template-columns:1fr 1fr 1fr;}
.card{background:var(--card); border-radius:14px; padding:14px 16px; box-shadow:0 2px 10px rgba(0,0,0,.05); min-width:0;}
.card h3{font-size:15px; font-weight:700; display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.card h3 .t{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; flex:none;}
.card h3 .t svg{width:16px; height:16px; fill:none; stroke:#fff; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round;}
.h-blue{color:#1d4ed8;} .h-blue .t{background:#2563eb;}
.h-green{color:#15803d;} .h-green .t{background:#16a34a;}
.h-red{color:#dc2626;} .h-red .t{background:#ef4444;}
.h-purple{color:#5b21b6;} .h-purple .t{background:#7c3aed;}
.chartbox{position:relative; height:190px;}
.donut{display:flex; align-items:center; gap:6px;}
.donut .legend{flex:1; font-size:12.5px; min-width:0;}
.donut .legend div{display:flex; align-items:center; gap:7px; padding:4px 0;}
.donut .legend i{width:10px; height:10px; border-radius:50%; flex:none;}
.donut .legend .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.donut .legend b{font-weight:700;}
.donut .cv{position:relative; width:150px; height:150px; flex:none;}
.empty{color:var(--muted); font-size:13px; text-align:center; padding:26px 0;}

/* ---------- tables ---------- */
.tbl-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
.tbl-head h3{margin:0;}
.va{border:0; color:#fff; font:inherit; font-size:11.5px; font-weight:600; padding:5px 12px; border-radius:7px; cursor:pointer;}
.va.red{background:#ef4444;} .va.green{background:#16a34a;}
.tw{overflow-x:auto;}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th{text-align:left; padding:9px 7px; font-weight:700; white-space:nowrap;}
td{padding:9px 7px; border-top:1px solid var(--line); white-space:nowrap; max-width:118px; overflow:hidden; text-overflow:ellipsis;}
td.amt,th.amt{text-align:right; max-width:none;}
.t-red th{background:#fee2e2;} .t-green th{background:#dcfce7;}
tbody tr:nth-child(even) td{background:#fafafa;}

/* ---------- summary rows ---------- */
.sum{display:flex; align-items:center; gap:12px; padding:9px 12px; border-radius:10px; border:1px solid var(--line); margin-bottom:8px; background:#fff; font-size:14px;}
.sum .si{width:30px; height:30px; border-radius:8px; display:grid; place-items:center; flex:none;}
.sum .si svg{width:17px; height:17px; fill:none; stroke:#fff; stroke-width:2.4; stroke-linecap:round; stroke-linejoin:round;}
.sum .sl{flex:1;} .sum .sv{font-weight:600;}
.sum.hl{background:#ede9fe; border-color:#ddd6fe; font-weight:700; color:#4c1d95;}
.sum.hl2{background:#dbeafe; border-color:#bfdbfe; font-weight:700; color:#1e3a8a;}
.foot{text-align:center; color:var(--muted); font-size:12px; margin-top:6px;}

@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(4,1fr);}
  .r-charts{grid-template-columns:1fr 1fr;} .r-tables{grid-template-columns:1fr 1fr;} .r-tables .salary{grid-column:1/-1;}
}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,1fr);}
  .r-charts,.r-tables,.r-bottom{grid-template-columns:1fr;}
  .donut{flex-direction:column;} .donut .legend{width:100%;}
}
</style>
</head>

const kfmt = v => { const a = Math.abs(v); return a >= 1000000 ? (v/1000000).toFixed(1).replace(/\.0$/,'') + 'M' : a >= 1000 ? (v/1000).toFixed(a%1000?1:0).replace(/\.0$/,'') + 'K' : String(v); };

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function applyStaticText(){

/* ===================== ডেটা আনা ===================== */
async function load(manual){
  const btn = $('refreshBtn'); if(manual) btn.disabled = true;
  try{
    const res = await fetch(API_URL + (API_URL.indexOf('?') > -1 ? '&' : '?') + 'view=public&_=' + Date.now(), {redirect:'follow'});
    const json = await res.json();
    if(!json || !json.ok) throw new Error((json && json.error) || 'bad response');
    DATA = json; $('alertBox').style.display = 'none';
    $('updated').textContent = tr('updated') + ': ' + new Date().toLocaleTimeString(tr('loc'), {hour:'2-digit', minute:'2-digit'});
  }catch(e){
    $('alertBox').textContent = tr('err'); $('alertBox').style.display = 'block';
    if(!DATA) DATA = emptyData();
  }finally{ btn.disabled = false; }
  render();
}
function emptyData(){
  const z = {income:0, expense:0, salary:0, surplus:0, incomeCats:[], expenseCats:[]};
  return {ok:true, month:z, year:z, trend:{income:new Array(12).fill(0), expense:new Array(12).fill(0)}, cash:0, bank:0, totalBalance:0, members:0, salaryDist:[], recentExpenses:[], recentIncome:[], assets:0, liabilities:0, netWorth:0};
}

/* ===================== আঁকা ===================== */
const centerText = {
  id:'centerText',
  afterDraw(chart, args, opts){
    if(!opts || !opts.text) return;
    const {ctx, chartArea:{left, right, top, bottom}} = chart;
    ctx.save(); ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#111827';
    ctx.font = '600 13px Poppins, Hind Siliguri, sans-serif';
    ctx.fillText(opts.text, (left + right) / 2, (top + bottom) / 2);
    ctx.restore();
  }
};
const barLabels = {
  id:'barLabels',
  afterDatasetsDraw(chart){
    const {ctx} = chart; const meta = chart.getDatasetMeta(0);
    ctx.save(); ctx.fillStyle = '#111827'; ctx.font = '600 11px Poppins, sans-serif'; ctx.textAlign = 'center';
    meta.data.forEach((bar, i) => { const v = chart.data.datasets[0].data[i]; if(v > 0) ctx.fillText(kfmt(v), bar.x, bar.y - 6); });
    ctx.restore();
  }
};
function mk(id, cfg){
  if(typeof Chart === 'undefined') return;
  if(charts[id]){ charts[id].destroy(); }
  charts[id] = new Chart($(id), cfg);
}
function lineCfg(values, color, fill){
  return {
    type:'line',
    data:{labels:tr('months'), datasets:[{data:values, borderColor:color, backgroundColor:fill, fill:true, tension:.35, pointRadius:3.5, pointBackgroundColor:color, pointBorderColor:'#fff', pointBorderWidth:1.2, borderWidth:2}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ' ' + taka(c.parsed.y)}}},
      scales:{x:{grid:{display:false}, ticks:{font:{size:10}, maxRotation:0, autoSkip:true}}, y:{position:'right', beginAtZero:true, grid:{color:'#eef0f2'}, ticks:{font:{size:10}, callback:v => kfmt(v), maxTicksLimit:5}}}}
  };
}
function donut(canvasId, legendId, cats, colors, total){
  const list = (cats || []).filter(c => c.value > 0);
  const sum = list.reduce((a, c) => a + c.value, 0);
  const lg = $(legendId);
  if(!list.length){
    lg.innerHTML = '<div class="empty" style="padding:30px 0">' + esc(tr('noData')) + '</div>';
    if(charts[canvasId]){ charts[canvasId].destroy(); delete charts[canvasId]; }
    return;
  }
  lg.innerHTML = list.map((c, i) => '<div><i style="background:' + colors[i % colors.length] + '"></i><span class="nm" title="' + esc(catName(c.name)) + '">' + esc(c.name === 'অন্যান্য' ? tr('others') : catName(c.name)) + '</span><b>' + Math.round(c.value / sum * 100) + '%</b></div>').join('');
  mk(canvasId, {type:'doughnut',
    data:{labels:list.map(c => c.name === 'অন্যান্য' ? tr('others') : catName(c.name)), datasets:[{data:list.map(c => c.value), backgroundColor:list.map((_, i) => colors[i % colors.length]), borderWidth:2, borderColor:'#fff'}]},
    options:{responsive:true, maintainAspectRatio:false, cutout:'62%', plugins:{legend:{display:false}, centerText:{text:taka(total)}, tooltip:{callbacks:{label:c => ' ' + c.label + ': ' + taka(c.parsed)}}}},
    plugins:[centerText]});
}
function fmtDate(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if(!m) return esc(s || '');
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return d.toLocaleDateString(tr('loc'), {day:'2-digit', month:'short', year:'numeric'});
}
function renderTables(){

    const arr = (list || []).slice(0, SHOW_ALL[key] ? 20 : 5);
    if(!arr.length) return '<tr><td colspan="4" class="empty">' + esc(tr('noData')) + '</td></tr>';
    return arr.map(r => '<tr><td>' + fmtDate(r.date) + '</td><td title="' + esc(catName(r.category)) + '">' + esc(catName(r.category)) + '</td><td title="' + esc(r.details) + '">' + esc(r.details) + '</td><td class="amt">' + taka(r.amount) + '</td></tr>').join('');
  };
  $('tbExp').innerHTML = rows(DATA.recentExpenses, 'exp');
  $('tbInc').innerHTML = rows(DATA.recentIncome, 'inc');
}
function render(){
  if(!DATA) return;
  const p = DATA[PERIOD] || emptyData().month;
  $('vSurplus').textContent = taka(p.surplus); $('vBank').textContent = taka(DATA.bank); $('vCash').textContent = taka(DATA.cash);
  $('vExpense').textContent = taka(p.expense); $('vIncome').textContent = taka(p.income); $('vSalary').textContent = taka(p.salary);
  $('vMembers').textContent = nf(DATA.members);
  mk('cExpTrend', lineCfg(DATA.trend.expense, '#ef4444', 'rgba(239,68,68,.18)'));
  mk('cIncTrend', lineCfg(DATA.trend.income, '#16a34a', 'rgba(34,197,94,.20)'));
  donut('cExpCat', 'lgExp', p.expenseCats, COL_EXP, p.expense);
  donut('cIncCat', 'lgInc', p.incomeCats, COL_INC, p.income);
  renderTables();
  const sal = (DATA.salaryDist || []).filter(x => x.value > 0);
  $('salEmpty').style.display = sal.length ? 'none' : 'block'; $('salEmpty').textContent = tr('noData');
  $('cSal').parentNode.style.display = sal.length ? 'block' : 'none';
  if(sal.length){
    const pal = ['#2563eb','#34d399','#fbbf24','#a78bfa','#f87171'];
    mk('cSal', {type:'bar', data:{labels:sal.map(x => x.name === 'অন্যান্য' ? tr('others') : catName(x.name)), datasets:[{data:sal.map(x => x.value), backgroundColor:sal.map((_, i) => pal[i % pal.length]), borderRadius:3, maxBarThickness:46}]},
      options:{responsive:true, maintainAspectRatio:false, layout:{padding:{top:18}}, plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ' ' + taka(c.parsed.y)}}},
        scales:{x:{grid:{display:false}, ticks:{font:{size:10.5}}}, y:{beginAtZero:true, grid:{color:'#eef0f2'}, ticks:{font:{size:10}, callback:v => kfmt(v), maxTicksLimit:6}}}}, plugins:[barLabels]});
  }
  $('sIncome').textContent = taka(p.income); $('sExpense').textContent = taka(p.expense); $('sSalary').textContent = taka(p.salary); $('sSurplus').textContent = taka(p.surplus);
  $('pCash').textContent = taka(DATA.cash); $('pBank').textContent = taka(DATA.bank); $('pTotal').textContent = taka(DATA.totalBalance);
  $('aAssets').textContent = taka(DATA.assets); $('aLiab').textContent = taka(DATA.liabilities); $('aNet').textContent = taka(DATA.netWorth);
}

applyStaticText();
load();
setInterval(() => load(false), AUTO_REFRESH_MS);
</script>
</body>
</html>
